name: Build and Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force a build/release of the current version on main"
        required: false
        default: "true"
        type: string

concurrency:
  group: rterm-build
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      should_build: "true"
      new_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PAT_TOKEN }}
      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r '.version' version.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building and releasing RTerm v$VERSION from main (no upstream sync — RTerm is now maintained independently)."

  build-mac:
    name: Build macOS ARM64
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Sync version from version.json to package.json
        run: |
          VERSION=$(jq -r '.version' version.json)
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          echo "Synced package.json version to $VERSION"
      - run: npm install
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          find dist -maxdepth 1 -name "*.dmg" | while read f; do
            echo "Uploading $f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rterm-mac
          path: dist/*arm64.dmg
          retention-days: 1

  build-win:
    name: Build Windows x64
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Sync version from version.json to package.json
        shell: bash
        run: |
          VERSION=$(jq -r '.version' version.json)
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          echo "Synced package.json version to $VERSION"
      - run: npm install
        continue-on-error: true
      - name: Remove canvas (fails without dev headers)
        shell: pwsh
        run: Remove-Item -Recurse -Force node_modules\canvas -ErrorAction SilentlyContinue
      - name: Fix Windows spawnSync
        shell: pwsh
        run: |
          $files = @('apps/electron/prepare-cli-runtime.mjs', 'apps/electron/prepare-mobile-web.mjs')
          foreach ($f in $files) {
            if (Test-Path $f) {
              $content = Get-Content $f -Raw
              $patched = $content -replace "stdio: 'inherit'", "shell: true, stdio: 'inherit'"
              Set-Content $f $patched -NoNewline
              Write-Host "Patched $f"
            }
          }
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: rterm-win
          path: |
            dist/*Portable*.exe
            dist/*Setup*.exe
          retention-days: 1

  build-linux-x64:
    name: Build Linux x64
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm fakeroot dpkg libarchive-tools
      - name: Sync version from version.json to package.json
        run: |
          VERSION=$(jq -r '.version' version.json)
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          echo "Synced package.json version to $VERSION"
      - run: npm install || true
      - run: rm -rf node_modules/canvas
      - run: npm run dist:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: rterm-linux-x64
          path: |
            dist/*x64.AppImage
            dist/*x64.deb
            dist/*x64.pacman
            dist/*x64.rpm
          retention-days: 1

  build-linux-arm64:
    name: Build Linux ARM64
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm fakeroot dpkg libarchive-tools
      - name: Sync version from version.json to package.json
        run: |
          VERSION=$(jq -r '.version' version.json)
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          echo "Synced package.json version to $VERSION"
      - run: npm install || true
      - run: rm -rf node_modules/canvas
      - run: npm run dist:linux-arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: rterm-linux-arm64
          path: |
            dist/*arm64.AppImage
            dist/*arm64.deb
            dist/*arm64.rpm
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [prepare, build-mac, build-win, build-linux-x64, build-linux-arm64]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync version from version.json to package.json
        run: |
          VERSION=$(jq -r '.version' version.json)
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          echo "Synced package.json version to $VERSION"
      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' version.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        run: ls -lh dist/ || true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NAME: "RTerm v${{ steps.version.outputs.version }}"
        run: |
          set -uo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          # Build the release body from CHANGELOG.md: extract this version's section
          # (## vX.Y.Z ... up to the next "## v" heading). Fallback to a generic note
          # if the section isn't found, so the release always has a real body and
          # never a stale hardcoded template.
          BODY_FILE="/tmp/release-notes.md"
          {
            echo "RTerm v${VERSION} — AI-Native Terminal App by Hyperspace Technologies"
            echo ""
          } > "$BODY_FILE"
          SECTION=$(awk -v ver="$VERSION" '
            $0 ~ "^## v" ver "( |$)" { inf=1; print; next }
            inf && /^## v[0-9]/ { exit }
            inf { print }
          ' CHANGELOG.md || true)
          if [ -n "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$SECTION" >> "$BODY_FILE"
          else
            echo "See CHANGELOG.md for details of this release." >> "$BODY_FILE"
          fi
          # Append the Downloads + Install table (indented echo lines so the whole
          # thing stays inside this run: | block — a column-0 heredoc would break YAML).
          {
            echo ""
            echo "## Downloads"
            echo ""
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| macOS ARM64 | \`RTerm-${VERSION}-arm64.dmg\` |"
            echo "| Windows x64 (Portable) | \`RTerm.Portable.${VERSION}-x64.exe\` |"
            echo "| Windows x64 (Setup) | \`RTerm.Setup.${VERSION}-x64.exe\` |"
            echo "| Linux x64 (AppImage) | \`RTerm-${VERSION}-x64.AppImage\` |"
            echo "| Linux x64 (deb) | \`RTerm-${VERSION}-x64.deb\` |"
            echo "| Linux x64 (pacman) | \`RTerm-${VERSION}-x64.pacman\` |"
            echo "| Linux x64 (rpm) | \`RTerm-${VERSION}-x64.rpm\` |"
            echo "| Linux ARM64 (AppImage) | \`RTerm-${VERSION}-arm64.AppImage\` |"
            echo "| Linux ARM64 (deb) | \`RTerm-${VERSION}-arm64.deb\` |"
            echo "| Linux ARM64 (rpm) | \`RTerm-${VERSION}-arm64.rpm\` |"
            echo ""
            echo "## Install"
            echo ""
            echo "**macOS:** After installing, run \`xattr -cr /Applications/RTerm.app\` to remove quarantine."
            echo ""
            echo "**Linux AppImage:** \`chmod +x RTerm-*.AppImage && ./RTerm-*.AppImage\`"
            echo ""
            echo "**Linux deb:** \`sudo dpkg -i RTerm-*.deb\`"
            echo ""
            echo "**Linux rpm:** \`sudo rpm -i RTerm-*.rpm\`"
            echo ""
            echo "---"
            echo ""
            echo "Contact: rterm@hyperspace.ng"
          } >> "$BODY_FILE"
          ASSETS="dist/*.dmg dist/*.exe dist/*.AppImage dist/*.deb dist/*.pacman dist/*.rpm"
          # Resilient create/update: retries through transient GitHub API 5xx
          # (softprops/action-gh-release failed repeatedly with 503 Unicorn
          # pages on getReleaseByTag). gh CLI + explicit retry avoids that.
          OK=0

          for attempt in 1 2 3 4 5; do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              # Release already exists (e.g. a prior attempt published it
              # without assets) — upload/overwrite assets.
              if gh release upload "$RELEASE_TAG" --clobber $ASSETS; then
                echo "Assets uploaded to existing release $RELEASE_TAG"
                OK=1
                break
              fi
            else
              if gh release create "$RELEASE_TAG" \
                  --title "$RELEASE_NAME" \
                  --notes-file /tmp/release-notes.md \
                  --target main \
                  $ASSETS; then
                echo "Created release $RELEASE_TAG with assets"
                OK=1
                break
              fi
            fi
            echo "Release attempt $attempt failed; retrying in 20s..."
            sleep 20
          done
          if [ "$OK" != "1" ]; then
            echo "::error::Failed to create/upload release $RELEASE_TAG after 5 attempts"
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json name,tagName,assets | jq '{tag:.tagName, name, assets:[.assets[].name]}'

      - name: Notify Multica autopilot
        if: success()
        # A transient network failure reaching api.multica.ai must never
        # fail the release — by this point the GitHub release is already
        # published. continue-on-error keeps the job green; the retry loop
        # below handles short blips, and a final warning is emitted instead
        # of a hard exit so downstream release-publish observers still see
        # a successful release.
        continue-on-error: true
        run: |
          # Fire the Multica RTerm Release Pipeline autopilot directly.
          # We cannot rely on the release: published event because GitHub
          # blocks that event from triggering downstream workflows when the
          # release is created inside a running workflow (even with a PAT).
          python3 -c "
          import json, urllib.request, urllib.error, time
          payload = json.dumps({
            'action': 'published',
            'release': {
              'tag_name': 'v${{ steps.version.outputs.version }}',
              'draft': False,
              'prerelease': False
            },
            'repository': {
              'full_name': 'DrOlu/RTerm',
              'name': 'RTerm'
            }
          }).encode()
          req = urllib.request.Request(
            'https://api.multica.ai/api/webhooks/autopilots/awt_jZXas3khd6pPhcNi7CkZTSBRbI_iDUsz-jSV2PN_blw',
            data=payload,
            headers={'Content-Type': 'application/json'}
          )
          last = None
          for attempt in range(1, 4):
            try:
              urllib.request.urlopen(req, timeout=30)
              print('Multica RTerm autopilot notified')
              break
            except Exception as e:
              last = e
              print(f'attempt {attempt} failed: {e}')
              if attempt < 3:
                time.sleep(10)
          else:
            print(f'::warning::Could not notify Multica autopilot after 3 attempts: {last}')
          "

      - name: Notify via Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="✅ Released"
          if [ "${{ job.status }}" != "success" ]; then STATUS="❌ Failed"; fi
          VERSION="${{ steps.version.outputs.version }}"
          PAYLOAD=$(jq -nc \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "${STATUS} *RTerm v${VERSION}*

          Built from GyShell v${VERSION}.
          All platforms: macOS, Windows, Linux (x64 + ARM64).

          https://github.com/DrOlu/RTerm/releases/tag/v${VERSION}" \
            '{chat_id:$chat_id,parse_mode:"Markdown",text:$text}')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true
